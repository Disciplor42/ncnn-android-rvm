plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tencent.rvmncnn'
    compileSdk 34
    ndkVersion "30.0.16248370"

    defaultConfig {
        applicationId "com.tencent.rvmncnn"
        archivesBaseName = "flipcam"

        minSdkVersion 28
        targetSdkVersion 34

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    externalNativeBuild {
        cmake {
            version "3.31.5"
            path file('src/main/jni/CMakeLists.txt')
        }
    }

    dependencies {
        implementation 'androidx.appcompat:appcompat:1.6.1'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
